# Render Blueprint: web service + managed PostgreSQL. (Use this OR deploy the app on Vercel and keep only the database on Render.)
databases:
  - name: datapay-db
    plan: basic-256mb
    databaseName: datapay
    user: datapay

services:
  - type: web
    name: datapay
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: datapay-db, property: connectionString }
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false        # set to https://<your-service>.onrender.com (or your custom domain)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
